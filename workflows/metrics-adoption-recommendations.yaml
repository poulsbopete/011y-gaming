version: "1"
name: Metrics adoption — AI dashboard notes
description: |
  Every **10 minutes** (and on manual run), calls the default Elastic AI agent (`ai.agent`)
  for **Aether Games Grafana/PromQL** dashboard analysis on Observability Serverless.
  Indexes into **metrics-adoption-recommendations** and refreshes library Markdown
  **workshop-ai-rec-grafana** (attached to each Aether — * board after Lab 1 migrate).

  Audience: existing Elastic customers adopting metrics via Grafana board migration.
enabled: true
tags:
  - metrics-adoption
  - grafana
  - aether-games
  - otlp
  - ai
  - DEMO
triggers:
  - type: scheduled
    with:
      every: "10m"
  - type: manual

consts:
  dashboard_catalog: |
    1. Aether — Platform overview — RPS, error rate, latency, concurrent players, request rate by service
    2. Aether — Matchmaking — queue depth, wait time, tickets/sec, matches, region breakdowns
    3. Aether — Session gateway — gateway RPS, 5xx, active sessions, connect latency
    4. Aether — Region capacity — concurrent players vs capacity by region
    5. Aether — Auth & login — login success/failure, auth latency
    6. Aether — Store checkout — checkout volume and duration
    7. Aether — Voice & chat — voice sessions and chat message rate
    8. Aether — Launch window SLO — error-budget style launch availability signal
    9. Aether — Party & social — parties, invites, party latency
    10. Aether — Presence service — presence updates/s, online users, fan-out lag, by region
    11. Aether — Inventory & entitlements — entitlement grants and grant latency
    12. Aether — Anti-cheat signals (O11Y) — signal volume and flagged sessions
    13. Aether — CDN & edge delivery — cache hit ratio and edge latency
    14. Aether — Dependency latency — postgres / redis / kafka dependency timings

steps:
  - name: workflow-start
    type: console
    with:
      message: |
        Aether AI dashboard notes started (execution {{ execution.id }}).
        Generating Agent Builder analysis for migrated Grafana → Kibana boards.

  - name: agent_grafana
    type: ai.agent
    with:
      message: |
        You are an Elastic Observability SRE coach for the fictional AAA studio **Aether Games**.

        Telemetry path: OpenTelemetry → Grafana Alloy → Elastic managed OTLP (mOTLP).
        Indices: **metrics-***, **logs-***, **traces-***. Region is usually top-level **region**.
        Latency series are **gauges** (avg(...)); counters/up-down counters are plain numerics.
        Alert drafts may exist but are imported **disabled** until reviewed.

        Dashboard catalog (one section each):
        {{ consts.dashboard_catalog }}

        Produce markdown (max ~80 lines) with **one H3 section per dashboard** in catalog order.
        For each dashboard include:
        - **Shows** — 1–2 sentences
        - **Read** — 2–4 golden-signal bullets
        - **Issues & resolve** — healthy → "No acute issue — continue monitoring."; else prefer:
          1. verification_exception on *_sum/*_count/value → remigrate with WORKSHOP_FORCE_OTEL_RESTART=1
          2. Unknown column cloud.region → patch_aether_dashboard_region_fields.py --search Aether
          3. High 5xx / auth failures → Discover + Auth/Session gateway; review disabled alert drafts
          4. Empty charts → restart fleet, wait 1–2 minutes

        End with a short **Ops checklist** (5 bullets) and one paragraph on why migrating PromQL
        boards accelerates metrics adoption on Elastic vs rebuilding charts by hand.

        Do not invent cluster hostnames.

  - name: index_grafana
    type: elasticsearch.request
    with:
      method: POST
      path: /metrics-adoption-recommendations/_doc
      body:
        "@timestamp": "{{ now | date: '%Y-%m-%dT%H:%M:%SZ' }}"
        execution_id: "{{ execution.id }}"
        workflow_name: "{{ workflow.name }}"
        source: workflow_ai_recommendations
        dashboard_platform: grafana
        recommendation: "{{ steps.agent_grafana.output.message }}"

  - name: publish_markdown_grafana
    type: kibana.request
    with:
      method: POST
      path: /api/saved_objects/markdown/workshop-ai-rec-grafana?overwrite=true
      headers:
        kbn-xsrf: "true"
      body:
        attributes:
          title: "AI Aether dashboard analysis"
          description: "Agent Builder analysis for Aether Games Grafana → Kibana boards"
          content: "{{ steps.agent_grafana.output.message }}"

  - name: sync_briefs_markdown
    type: kibana.request
    with:
      method: POST
      path: /api/saved_objects/markdown/workshop-aether-dashboard-briefs?overwrite=true
      headers:
        kbn-xsrf: "true"
      body:
        attributes:
          title: "Aether — AI dashboard briefs"
          description: "Synced from Metrics adoption — AI dashboard notes workflow"
          content: "{{ steps.agent_grafana.output.message }}"

  - name: workflow-done
    type: console
    with:
      message: |
        Indexed recommendations and refreshed workshop-ai-rec-grafana + workshop-aether-dashboard-briefs.
        Open any Aether — * dashboard (AI strip) or Dashboards → **Aether — AI notes**.
